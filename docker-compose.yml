# Docker Compose for local, production-like testing of the Vapor app.
#
#   Build:  docker compose build
#   Start:  docker compose up app
#   Stop:   docker compose down
#
# For real deployment, pull the CI-published image from
# ghcr.io/getappbox/install-helper (see .github/workflows/docker-image.yml),
# or run it under systemd (installhelper.service).

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  app:
    image: install-helper:latest
    build:
      context: .
    # Secrets (APPBOX_CLIENT_TOKEN, MAILGUN_API_KEY, YOURLS_SIGNATURE_SECRET, …) come from a
    # gitignored .env file next to this compose file — never baked into the image or committed.
    env_file:
      - .env
    environment:
      <<: *shared_environment
    ports:
      - '2551:8080'
    restart: unless-stopped
